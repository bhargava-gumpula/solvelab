[package]
name = "solvelab"
version = "0.1.0"
description = "SolveLab for Mac"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same versions wry already uses: tabFocusesLinks and the Edit menu's emoji item.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKPreferences"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Test-only: IPC health check + page-walk reporter for scripts/desktop-smoke.mjs. Never in release builds.
smoke = []
