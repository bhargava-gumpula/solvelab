[package]
name = "solvelab"
version = "0.1.0"
description = "SolveLab for Mac"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
